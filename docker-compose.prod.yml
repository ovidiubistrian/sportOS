# Production stack.
#
# Deliberately not an extension of `docker-compose.yml`: that file mounts the
# working tree, runs dev servers, seeds demo data and ships a fake mailbox.
# Inheriting from it and overriding the dangerous parts means one forgotten
# override is a demo club on a customer's server, so this stands alone.
#
# Images are built by CI and pulled by tag. Nothing here builds on the server —
# a VPS with 4GB of memory cannot compile a Next application and serve traffic
# at the same time, and a deploy that builds is a deploy that can fail halfway.

x-api-image: &api-image
  image: ghcr.io/${GITHUB_REPOSITORY:-ovidiubistrian/sportos}/api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infrastructure/docker/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # The admin bundle is static in production, served straight off disk by
      # the proxy rather than by a container of its own.
      - admin-dist:/srv/admin:ro
    depends_on: [api, public-web]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: footbola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Nightly dumps land here; see docs/DEPLOY.md for restoring one.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d footbola"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # `start`, not `start-dev`: production mode refuses to run without HTTPS
    # awareness and a real database, which is the point.
    #
    # Not `--optimized`: that flag promises the image was already built with
    # these options baked in, and this is the stock image. Keycloak would
    # refuse to start rather than apply KC_DB at runtime.
    command: ["start", "--import-realm", "--proxy-headers", "xforwarded", "--hostname", "https://auth.${PLATFORM_DOMAIN}"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Tokens are minted at auth.<domain>, but the API talks to Keycloak over
      # the Docker network. Without this the backchannel would advertise the
      # public hostname to a container that cannot resolve it.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # Rendered from realm-prod.json.template by first-boot.sh, because the
      # client secrets and every redirect URI depend on .env. Imported once —
      # after that the realm lives in the database and this is ignored.
      - ./infrastructure/docker/keycloak/generated:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data

  api:
    <<: *api-image
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    volumes:
      # The GeoIP city database, fetched on the host. Absent, analytics simply
      # records no geography.
      - geoip-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  outbox-relay:
    <<: *api-image
    # `app.events.relay` is the library; `app.events.runner` is the process.
    # Running the library imports it and exits 0, which under `unless-stopped`
    # is an infinite restart loop that never delivers an event and never says
    # anything about it.
    command: ["python", "-m", "app.events.runner"]

  feed-scheduler:
    <<: *api-image
    command: ["python", "-m", "app.integrations.scheduler"]

  public-web:
    image: ghcr.io/${GITHUB_REPOSITORY:-ovidiubistrian/sportos}/public-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: https://api.${PLATFORM_DOMAIN}
      NEXT_PUBLIC_PLATFORM_HOST: ${PLATFORM_DOMAIN}
      NEXT_PUBLIC_ADMIN_URL: https://${PLATFORM_DOMAIN}/signin
      OIDC_ISSUER: http://keycloak:8080/realms/football-os
      OIDC_PUBLIC_ISSUER: https://auth.${PLATFORM_DOMAIN}/realms/football-os
      SUPPORTER_CLIENT_ID: supporter-web
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      REDIS_URL: redis://redis:6379/1
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Not a long-running service: it copies the freshly built admin bundle into
  # the volume the proxy serves, then exits. Run on every deploy.
  admin-dist:
    image: ghcr.io/${GITHUB_REPOSITORY:-ovidiubistrian/sportos}/admin-web:${IMAGE_TAG:-latest}
    command: ["sh", "-c", "rm -rf /out/* && cp -r /usr/share/nginx/html/. /out/"]
    volumes:
      - admin-dist:/out
    restart: "no"

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  minio-data:
  geoip-data:
  admin-dist:
