name: Deploy

# Runs only after CI passes on main, and can be started by hand for a rollback
# — `image_tag` accepts any previously built SHA.
#
# The shape is: build once, push to the registry, then tell the server to pull.
# Nothing is built on the VPS. A 4GB server cannot compile a Next application
# and serve traffic at the same time, and a deploy that builds is a deploy that
# can fail with the site half-updated.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (a commit SHA, or 'latest')"
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # A green CI run, or a deliberate hand-started deploy. Never a failed one.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.names.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      # `github.repository` is `ovidiubistrian/sportOS`, and a registry path
      # must be lowercase. The expression language has no way to say so, hence
      # a step. The deploy job reuses this, because the server pulls by the
      # same name.
      - name: Registry name
        id: names
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit as well as `latest`, because rolling back to
      # "the one before" needs a name that still means something next month.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repo }}/api:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.repo }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Public site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infrastructure/docker/node/Dockerfile
          target: next
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repo }}/public-web:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.repo }}/public-web:latest
          cache-from: type=gha,scope=public-web
          cache-to: type=gha,mode=max,scope=public-web

      - name: Admin bundle image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infrastructure/docker/node/Dockerfile
          target: prod
          # Baked in, not configured at run time: Vite resolves these while
          # building, so the bundle has to be built for the domain it will be
          # served from.
          build-args: |
            APP_DIR=apps/admin-web
            VITE_API_URL=https://api.${{ secrets.PLATFORM_DOMAIN }}
            VITE_OIDC_ISSUER=https://auth.${{ secrets.PLATFORM_DOMAIN }}/realms/football-os
            VITE_OIDC_CLIENT_ID=admin-web
            VITE_PUBLIC_SITE_DOMAIN=${{ secrets.PLATFORM_DOMAIN }}
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repo }}/admin-web:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.repo }}/admin-web:latest
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # The server logs in to the registry with this run's token, so it needs to
    # be allowed to read packages. Without it the pull fails on a private repo.
    permissions:
      contents: read
      packages: read
    steps:
      # `missing server host` from inside the SSH action is a long way from
      # "you have not added VPS_HOST yet", which is what it always means.
      - name: Check the secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY PLATFORM_DOMAIN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Not set, under Settings → Secrets and variables → Actions:$missing"
            echo "infrastructure/scripts/bootstrap-vps.sh prints all four."
            exit 1
          fi

          # Present is not the same as usable. A key pasted without its BEGIN
          # and END lines, or flattened onto one line by a terminal, gets as
          # far as `ssh: no key found` from inside the SSH action — which does
          # not mention the secret it is complaining about.
          case "$VPS_SSH_KEY" in
            *"-----BEGIN "*"PRIVATE KEY-----"*) ;;
            *) echo "VPS_SSH_KEY has no BEGIN line. Paste the whole file, markers included."; exit 1 ;;
          esac
          case "$VPS_SSH_KEY" in
            *"-----END "*"PRIVATE KEY-----"*) ;;
            *) echo "VPS_SSH_KEY has no END line. The paste was cut short."; exit 1 ;;
          esac
          if [ "$(printf '%s' "$VPS_SSH_KEY" | wc -l)" -lt 3 ]; then
            echo "VPS_SSH_KEY is on one line. Its newlines were lost in the paste."
            exit 1
          fi
          echo "all four present, key looks like a key"

      - name: Ship it
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # No `script_stop`: the action dropped it, and the script opens with
          # `set -euo pipefail`, which is the same promise made where it can be
          # read next to the commands it governs.
          script: |
            set -euo pipefail
            cd /opt/teamsport360

            export IMAGE_TAG="${{ github.event.inputs.image_tag || github.sha }}"
            # Lowercased in the build job. docker-compose.prod.yml interpolates
            # this straight into the image name, so the case has to match what
            # was actually pushed.
            export GITHUB_REPOSITORY="${{ needs.build.outputs.repo }}"

            git fetch --quiet origin main
            # A hand-started deploy names an older image. The compose file, the
            # Caddyfile and the migration history all live in the tree, so the
            # tree has to match the images — otherwise a rollback runs a
            # combination that was never built or tested.
            if [ "$IMAGE_TAG" = "latest" ] || [ "$IMAGE_TAG" = "${{ github.sha }}" ]; then
              git checkout --quiet -B main origin/main
            else
              git checkout --quiet --detach "$IMAGE_TAG"
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull --quiet

            # The revision that is live *before* migrations run. This is what
            # a rollback walks the schema back to, and it can only be read
            # while the old code is still the current code.
            PREVIOUS_REVISION="$(docker compose -f docker-compose.prod.yml run --rm -T api \
              .venv/bin/alembic current 2>/dev/null | grep -oE '^[0-9a-f]{12}' | head -1 || true)"

            # Verified, labelled and pruned — see the script. A dump that is
            # only discovered to be truncated when you need it is not a backup.
            ./infrastructure/scripts/backup.sh pre-deploy

            # Migrations are an explicit step and run before the new code, so
            # the old code never meets a schema it does not know. Additive
            # migrations only — see docs/DEPLOY.md.
            docker compose -f docker-compose.prod.yml run --rm api \
              .venv/bin/alembic upgrade head

            # Permissions and role templates are code, not data: a release
            # that adds a permission key ships a database that has never heard
            # of it, and every route and menu behind it is silently invisible
            # until somebody reseeds by hand. That is exactly how the ticketing
            # and card-payment screens shipped and stayed hidden.
            #
            # Idempotent, and it clears the permission cache itself, so running
            # it on every deploy costs a second and removes a whole class of
            # "it deployed but it is not there".
            docker compose -f docker-compose.prod.yml run --rm api \
              .venv/bin/python -m app.platform.seeds.reference

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml run --rm admin-dist

            docker image prune -f --filter "until=168h"

            # Prove it answers before calling the deploy done.
            sleep 8
            curl -fsS --max-time 10 https://api.${{ secrets.PLATFORM_DOMAIN }}/health >/dev/null
            curl -fsS --max-time 10 https://${{ secrets.PLATFORM_DOMAIN }}/ >/dev/null

            # Written only once the deploy has answered, so the log is a list
            # of releases that worked — which is what a rollback needs to pick
            # from. The revision recorded is the one from *before* migrations:
            # rolling back to this entry means going back to that schema.
            printf '%s %s %s %s\n' "$(date -Is)" "$IMAGE_TAG" \
              "${PREVIOUS_REVISION:-unknown}" "$(git rev-parse HEAD)" >> deploys.log

            echo "deployed ${IMAGE_TAG}"
            echo "roll back with: ./infrastructure/scripts/rollback.sh"
